name: Apple 配件新品追蹤

on:
  schedule:
    - cron: '0 1 * * *'   # 每天台灣時間早上 9:00（UTC+8，所以 UTC 01:00）
  workflow_dispatch:        # 也可以在 GitHub 手動觸發（方便測試）

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 還原快照快取
        uses: actions/cache@v4
        with:
          path: snapshot.json
          key: apple-snapshot-${{ runner.os }}
          restore-keys: |
            apple-snapshot-

      - name: 安裝 Python 套件
        run: pip install requests beautifulsoup4

      - name: 執行追蹤腳本
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python apple_accessories_tracker.py

      - name: 儲存最新快照
        uses: actions/cache/save@v4
        if: always()
        with:
          path: snapshot.json
          key: apple-snapshot-${{ runner.os }}-${{ github.run_id }}
